name: Run Good Block Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify browser tools
        run: |
          firefox --version
          geckodriver --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup summary
        run: echo "Environment ready for the parallel acceptance tests." >> "$GITHUB_STEP_SUMMARY"

  integration_tests:
    name: Integration suite
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: xvfb-run --auto-servernum pytest --alluredir=allure-results/integration -q tests/integration

      - name: Upload integration evidence and allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-allure-results
          path: |
            allure-results/integration/
            screenshots/
            dom/
            driver-logs/
          if-no-files-found: ignore

  e2e_tests:
    name: End-to-end suite
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run e2e tests
        run: xvfb-run --auto-servernum pytest --alluredir=allure-results/e2e -q tests/e2e

      - name: Upload e2e evidence and allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-results
          path: |
            allure-results/e2e/
            screenshots/
            dom/
            driver-logs/
          if-no-files-found: ignore

  evidence_report_finalize:
    name: Evidence, report and finalization
    needs: [integration_tests, e2e_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all evidence artifacts
        id: download_evidence
        continue-on-error: true
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: artifacts
          merge-multiple: true

      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-commandline-2.29.0.tgz -O allure.tgz
          mkdir -p /opt/allure
          tar -xzf allure.tgz -C /opt/allure --strip-components=1
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p report
          if [ -d "artifacts" ] && [ -n "$(find artifacts -maxdepth 2 -type d -name 'allure-results' -o -path 'artifacts/*' -type d | head -n 1)" ]; then
            mkdir -p allure-results
            find artifacts -type d -name 'allure-results' -exec cp -R {}/* allure-results/ \; 2>/dev/null || true
            allure generate allure-results --clean -o allure-report
            cp -R allure-report report/
          else
            echo "No Allure results were produced." > report/summary.md
          fi

      - name: Write final summary
        if: always()
        run: |
          {
            echo "# Good Block acceptance report";
            echo "";
            echo "- integration: ${{ needs.integration_tests.result }}";
            echo "- e2e: ${{ needs.e2e_tests.result }}";
            echo "- allure report: generated in the consolidated artifact";
          } > report/summary.md
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-evidence
          path: |
            artifacts/
            report/
            allure-report/
          if-no-files-found: ignore

      - name: Final status gate
        run: |
          if [ "${{ needs.integration_tests.result }}" != "success" ] || [ "${{ needs.e2e_tests.result }}" != "success" ]; then
            echo "One or more acceptance suites failed." && exit 1
          fi
          echo "All acceptance suites passed."
