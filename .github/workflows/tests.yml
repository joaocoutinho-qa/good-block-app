name: Run Good Block Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify browser tools
        run: |
          firefox --version
          geckodriver --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup summary
        run: echo "Environment ready for the parallel acceptance tests." >> "$GITHUB_STEP_SUMMARY"

  integration_tests:
    name: Integration suite
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: xvfb-run --auto-servernum pytest -q tests/integration

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            screenshots/
            dom/
            driver-logs/
          if-no-files-found: ignore

  e2e_tests:
    name: End-to-end suite
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run e2e tests
        run: xvfb-run --auto-servernum pytest -q tests/e2e

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            screenshots/
            dom/
            driver-logs/
          if-no-files-found: ignore

  evidence_report_finalize:
    name: Evidence, report and finalization
    needs: [integration_tests, e2e_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-evidence'
          path: artifacts
          merge-multiple: true

      - name: Write final summary
        run: |
          mkdir -p report
          {
            echo "# Good Block acceptance report";
            echo "";
            echo "- integration: ${{ needs.integration_tests.result }}";
            echo "- e2e: ${{ needs.e2e_tests.result }}";
          } > report/summary.md
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-evidence
          path: artifacts/
          if-no-files-found: ignore

      - name: Final status gate
        run: |
          if [ "${{ needs.integration_tests.result }}" != "success" ] || [ "${{ needs.e2e_tests.result }}" != "success" ]; then
            echo "One or more acceptance suites failed." && exit 1
          fi
          echo "All acceptance suites passed."
