name: Run Good Block Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify browser tools
        run: |
          firefox --version
          geckodriver --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup summary
        run: echo "Environment ready for the parallel acceptance tests." >> "$GITHUB_STEP_SUMMARY"

  integration_tests:
    name: Integration suite
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: xvfb-run --auto-servernum pytest --alluredir=allure-results/integration -q tests/integration

      - name: Upload integration evidence and allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-allure-results
          path: |
            allure-results/integration/
            screenshots/
            dom/
            driver-logs/
          if-no-files-found: ignore

  e2e_tests:
    name: End-to-end suite
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Firefox ESR
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run e2e tests
        run: xvfb-run --auto-servernum pytest --alluredir=allure-results/e2e -q tests/e2e

      - name: Upload e2e evidence and allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-results
          path: |
            allure-results/e2e/
            screenshots/
            dom/
            driver-logs/
          if-no-files-found: ignore

  evidence_report_finalize:
    name: Evidence, report and finalization
    needs: [integration_tests, e2e_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all evidence artifacts
        id: download_evidence
        continue-on-error: true
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: artifacts
          merge-multiple: true

      - name: Install Allure CLI
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/allure"
          curl -fsSL https://github.com/allure-framework/allure2/releases/download/2.46.1/allure-2.46.1.tgz -o "$RUNNER_TEMP/allure/allure.tgz"
          tar -xzf "$RUNNER_TEMP/allure/allure.tgz" -C "$RUNNER_TEMP/allure" --strip-components=1
          chmod +x "$RUNNER_TEMP/allure/bin/allure"
          echo "$RUNNER_TEMP/allure/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/allure/bin/allure" --version

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p report merged-allure-results

          find artifacts -type d -name 'allure-results' -print0 | while IFS= read -r -d '' result_dir; do
            find "$result_dir" -type f -name '*.json' -exec cp -f {} merged-allure-results/ \;
          done

          if [ -n "$(find merged-allure-results -type f | head -n 1)" ]; then
            rm -rf report
            allure generate merged-allure-results --clean --single-file -o report
            cp report/index.html report.html
            test -f report/index.html
            echo "Generated single-file report:"
            ls -lh report/index.html report.html
          else
            echo "No Allure results were produced." > report/summary.md
          fi

      - name: Write final summary
        if: always()
        run: |
          {
            echo "# Good Block acceptance report";
            echo "";
            echo "- integration: ${{ needs.integration_tests.result }}";
            echo "- e2e: ${{ needs.e2e_tests.result }}";
            echo "- allure report: available at report/index.html";
          } > report/summary.md
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-evidence
          path: |
            artifacts/
            report/
            report.html
          if-no-files-found: ignore

      - name: Final status gate
        run: |
          if [ "${{ needs.integration_tests.result }}" != "success" ] || [ "${{ needs.e2e_tests.result }}" != "success" ]; then
            echo "One or more acceptance suites failed." && exit 1
          fi
          echo "All acceptance suites passed."
