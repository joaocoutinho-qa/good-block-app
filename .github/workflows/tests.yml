name: Run Good Block Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-firefox:latest
        ports:
          - 4444:4444
        options: --shm-size=2g

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests in Selenium Firefox container
        env:
          SELENIUM_REMOTE_URL: http://127.0.0.1:4444/wd/hub
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4444/wd/hub/status; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          pytest -v

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            screenshots/
            dom/
            driver-logs/
          if-no-files-found: ignore
